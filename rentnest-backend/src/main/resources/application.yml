spring:
  application:
    name: rentnest-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rentnest}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:rentnest_app}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-key-must-be-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
